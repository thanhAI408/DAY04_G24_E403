# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng khi thiếu thông tin bắt buộc hoặc cần xác nhận trước hành động ghi/gửi. Dùng response_type=text khi cần URL/handle/chủ đề; yes_no khi cần xác nhận gửi/đăng; choice khi đưa danh sách lựa chọn rõ ràng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn, nêu đúng thông tin còn thiếu hoặc nội dung cần xác nhận"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời mong đợi: text, yes_no, hoặc choice"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng khi response_type=choice"}
      required: [question]

  - name: timeline
    description: "Lấy tweet/bài đăng mới nhất CỦA một tài khoản X/Twitter cụ thể. Dùng khi người dùng hỏi tweet của một người/tài khoản; map tên phổ biến sang handle khi biết chắc, ví dụ Sam Altman -> sama, Elon Musk -> elonmusk, Andrej Karpathy -> karpathy. Nếu thiếu tài khoản/handle thì dùng clarify."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X/Twitter không gồm @, ví dụ sama hoặc elonmusk"}
        limit: {type: integer, default: 5, description: "Số tweet cần lấy; lấy từ yêu cầu nếu có, mặc định 5"}
      required: [screenname]

  - name: social_search
    description: "Tìm tweet/bài đăng X/Twitter THEO CHỦ ĐỀ hoặc từ khóa, không phải timeline của một tài khoản. Dùng cho câu như 'mọi người đang nói gì về...', 'tweet về...', 'trên Twitter về...'. Dùng search_type=Top khi người dùng nói top/phổ biến/viral; mặc định Latest cho mới nhất."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc từ khóa cần tìm trên X/Twitter"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest cho mới nhất; Top cho phổ biến/top/viral"}
        limit: {type: integer, default: 5, description: "Số tweet cần lấy; lấy từ yêu cầu nếu có, mặc định 5"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm web bằng Tavily cho tin tức hoặc thông tin chung. Dùng cho câu hỏi về tin tức/web/current events khi không có URL cụ thể. Nếu người dùng đưa URL cụ thể thì dùng fetch; nếu hỏi paper/arXiv thì dùng papers/paper_text; nếu hỏi policy công ty thì dùng policy. Với 'hôm nay' dùng topic=news và timeframe=day; 'tuần này' dùng timeframe=week."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn web ngắn gọn, giữ đúng chủ đề người dùng yêu cầu"}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức/current events; general cho tra cứu thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=hôm nay/24h, week=tuần này/gần đây, month=tháng này, year=năm nay"}
        max_results: {type: integer, default: 5, description: "Số kết quả web cần lấy; mặc định 5"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung một URL cụ thể do người dùng cung cấp để tóm tắt/trích xuất. Dùng fetch cho từng URL nếu có nhiều link. Không dùng lookup khi URL đã có sẵn. Nếu người dùng nói 'bài này/link này' nhưng chưa đưa URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ cần đọc"}
      required: [url]

  - name: format
    description: "Định dạng các kết quả đã thu thập thành markdown/bản tin/thread. Chỉ dùng sau khi đã có items từ các tool khác hoặc dữ liệu rõ ràng từ người dùng; không dùng để tìm kiếm hay xác minh thông tin."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã có từ lookup/fetch/social_search/timeline/papers/paper_text hoặc dữ liệu người dùng cung cấp"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "brief ngắn; bullets danh sách; sections chia mục; thread dạng chuỗi bài; daily_ai_vn cho bản tin AI tiếng Việt"}
        headline: {type: string, default: "", description: "Tiêu đề nếu người dùng yêu cầu hoặc phù hợp với bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản lên Telegram. Đây là hành động ghi ra ngoài: chỉ gọi với confirmed=true sau khi người dùng đã xác nhận rõ ràng. Nếu người dùng yêu cầu gửi/đăng nhưng chưa xác nhận nội dung, dùng clarify response_type=yes_no trước; không tự ý gửi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung chính xác sẽ gửi"}
        confirmed: {type: boolean, default: false, description: "true chỉ khi đã có xác nhận rõ ràng từ người dùng"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu policy nội bộ của công ty. Dùng cho câu hỏi có 'policy công ty', 'theo company policy', quy định về citation/source, data privacy, external publishing, research workflow, hoặc tool usage. Không dùng lookup cho policy nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Câu hỏi hoặc từ khóa policy cần tìm"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Chọn nhóm cụ thể khi nhận ra: ai_research, source_citation, data_privacy, external_publishing, tool_usage; all nếu không chắc"}
        top_k: {type: integer, default: 3, description: "Số kết quả policy cần lấy; mặc định 3"}
      required: [query]

  - name: papers
    description: "Tìm paper/preprint trên arXiv theo chủ đề. Dùng khi người dùng muốn tìm research paper, paper mới, preprint, arXiv discovery, hoặc bài khoa học theo chủ đề. Nếu người dùng đưa arXiv ID/URL và muốn đọc nội dung/trích text thì dùng paper_text."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/từ khóa arXiv cần tìm"}
        max_results: {type: integer, default: 5, description: "Số paper cần lấy; tối đa implementation trả về 10"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "relevance mặc định; lastUpdatedDate/submittedDate cho paper mới/gần đây"}
      required: [query]

  - name: paper_text
    description: "Tải PDF arXiv và trích xuất text từ một paper cụ thể khi có arXiv ID hoặc URL. Dùng cho yêu cầu đọc/tóm tắt/trích text một paper arXiv cụ thể. Không dùng cho URL web thường; URL thường dùng fetch."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID hoặc URL, ví dụ 1706.03762 hoặc https://arxiv.org/abs/1706.03762"}
        max_pages: {type: integer, default: 5, description: "Số trang đầu cần đọc; lấy từ yêu cầu nếu có, mặc định 5"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa trả về; implementation giới hạn 1000-20000"}
      required: [arxiv_url]
